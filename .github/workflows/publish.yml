name: 打包发布

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 安装 Inno Setup
        uses: crazy-max/ghaction-chocolatey@v3
        with:
          args: install innosetup --no-progress

      - name: 方案 A — Framework-Dependent 发布
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: dotnet publish DsBatteryIndicator/DsBatteryIndicator.csproj -c Release -o publish/fd

      - name: 方案 B — Self-Contained 发布
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_wait_seconds: 30
          command: dotnet publish DsBatteryIndicator/DsBatteryIndicator.csproj -c Release -r win-x64 --self-contained -o publish/sc

      - name: 构建安装包 (Inno Setup)
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          (Get-Content installer/setup.iss) -replace '#define MyAppVersion ".+"', "#define MyAppVersion ""$ver""" | Set-Content installer/setup.iss
          Set-Location installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
          Set-Location ..
          Move-Item publish/installer/DS-Battery-Indicator-Setup.exe DS-Battery-Indicator-Setup-v$ver.exe

      - name: 打包 Framework-Dependent
        shell: pwsh
        run: |
          Move-Item publish/fd publish/DsBatteryIndicator
          Compress-Archive -Path publish/DsBatteryIndicator -DestinationPath DS-Battery-Indicator-framework-dependent.zip
          Move-Item publish/DsBatteryIndicator publish/fd

      - name: 打包 Self-Contained
        shell: pwsh
        run: |
          Move-Item publish/sc publish/DsBatteryIndicator
          Compress-Archive -Path publish/DsBatteryIndicator -DestinationPath DS-Battery-Indicator-self-contained.zip
          Move-Item publish/DsBatteryIndicator publish/sc

      - name: 上传 Artifact（手动触发用）
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            DS-Battery-Indicator-framework-dependent.zip
            DS-Battery-Indicator-self-contained.zip
            DS-Battery-Indicator-Setup-*.exe

      - name: 创建 Release 并上传（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DS-Battery-Indicator-framework-dependent.zip
            DS-Battery-Indicator-self-contained.zip
            DS-Battery-Indicator-Setup-*.exe
          generate_release_notes: true
